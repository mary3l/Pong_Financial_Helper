name: QA

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so `next build` can compile; CI never talks to a real Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-reports
          path: |
            reports/
            coverage/
          retention-days: 90
